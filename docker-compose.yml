# Local infrastructure for iPhoneHa.
#   docker compose up -d                 → PostgreSQL + Redis + MinIO (+ bucket init)
#   docker compose --profile app up -d   → also builds & runs the API and the web app
name: iphoneha

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iphoneha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iphoneha}
      POSTGRES_DB: ${POSTGRES_DB:-iphoneha}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-iphoneha}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-iphoneha-secret}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the media bucket and makes it publicly readable (product images).
  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:latest}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-iphoneha}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-iphoneha-secret}
      S3_BUCKET: ${S3_BUCKET:-iphoneha-media}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      mc anonymous set download local/$${S3_BUCKET} &&
      echo 'bucket ready'
      "
    restart: 'no'

  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-iphoneha}:${POSTGRES_PASSWORD:-iphoneha}@postgres:5432/${POSTGRES_DB:-iphoneha}?schema=public
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      STORAGE_DRIVER: s3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - '${API_PORT:-4000}:4000'

  web:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-3000}:3000'

volumes:
  pgdata:
  redisdata:
  miniodata:
