# ───────────────────────────────────────────────────────────────────────────
# iphoneha.com — Apache include (cPanel userdata)
# Install to BOTH:
#   /etc/apache2/conf.d/userdata/std/2_4/iphoneha/iphoneha.com/proxy.conf
#   /etc/apache2/conf.d/userdata/ssl/2_4/iphoneha/iphoneha.com/proxy.conf
# then:  /scripts/ensure_vhost_includes --user=iphoneha && systemctl restart httpd
#
# Everything that is not handled by the nginx include above (i.e. the HTML
# pages) arrives here and is handed to Next.js on the loopback.
# ───────────────────────────────────────────────────────────────────────────

ProxyPreserveHost On
ProxyTimeout 120

# One canonical address: www.iphoneha.com gets a single 301 to
# https://iphoneha.com, keeping the path and query (the canonical tags and the
# sitemap already use it). /.well-known stays on www so AutoSSL can still
# validate that name. Plain http on the bare domain is sent to https by
# cPanel's own «Force HTTPS Redirect» switch (Domains), which knows how its
# nginx proxy reaches Apache — a rule here could loop behind that proxy.
RewriteEngine On
RewriteCond %{HTTP_HOST} ^www\.iphoneha\.com$ [NC]
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteRule ^ https://iphoneha.com%{REQUEST_URI} [R=301,L]

# cPanel's own validation paths must keep being served from disk, otherwise
# AutoSSL cannot issue or renew the certificate.
ProxyPass /.well-known/ !
ProxyPass /cpanel !
ProxyPass /whm-server-status !

ProxyPass        / http://127.0.0.1:3000/ flushpackets=on
ProxyPassReverse / http://127.0.0.1:3000/

RequestHeader set X-Forwarded-Proto "https" env=HTTPS
