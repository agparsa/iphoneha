# ───────────────────────────────────────────────────────────────────────────
# iphoneha.com — nginx include (cPanel ea-nginx)
# Install to: /etc/nginx/conf.d/users/iphoneha/iphoneha.com/iphoneha-proxy.conf
#
# cPanel includes this INSIDE the server{} block of this domain only, so the
# other sites on the server are untouched. It deliberately does NOT declare
# `location /` — that one already exists in cPanel's generated vhost and a
# second one would make `nginx -t` fail. Page requests keep flowing through
# Apache (which proxies them to Next.js); the paths below skip that hop.
# ───────────────────────────────────────────────────────────────────────────

# The API, including the live-stock SSE stream. Buffering must stay off or the
# stream is held back until the response ends — the stock never updates.
location ^~ /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;      # SSE connections stay open
    client_max_body_size 12m;   # product image uploads from the admin panel
}

# Next.js build output: immutable, hashed filenames — cache them hard.
location ^~ /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_cache off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Optimised images and everything else Next serves.
location ^~ /_next/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Product photos, proxied by Next to the API's media route.
location ^~ /media/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=2592000" always;
}

# Brand assets and payment logos live in the Next build, not in public_html.
location ^~ /brand/   { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; }
location ^~ /payments/ { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; }

# No `location = /robots.txt` (or sitemap) here: cPanel's own server block
# already defines `location = /robots.txt`, and a second one makes `nginx -t`
# fail with "duplicate location". Both files reach Next through Apache instead.
